name: Orbit workers

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-workers
  cancel-in-progress: false

jobs:
  run-workers:
    name: Process Orbit background jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Orbit workers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ORBIT_INVITE_FROM: ${{ secrets.ORBIT_INVITE_FROM }}
          NEXT_PUBLIC_ORBIT_URL: ${{ secrets.NEXT_PUBLIC_ORBIT_URL }}
        run: node scripts/orbit/process-all-workers.mjs
