name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Architecture, lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Check brand assets
        run: pnpm check:brand-assets

      - name: Check identity and namespace contracts
        run: pnpm check:identity

      - name: Check SEO contracts
        run: pnpm check:seo

      - name: Check service-role boundaries
        run: pnpm check:service-role

      - name: Check source health
        run: pnpm check:source-health

      - name: Check dead code
        run: pnpm check:dead-code

      - name: Check documentation
        run: pnpm check:docs

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
